<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Dashboard Preview</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #040d1a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.15.3/umd/Recharts.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      async function boot() {
        if (!window.React || !window.ReactDOM || !window.Recharts || !window.Babel) {
          throw new Error(
            "CDN libraries did not load. Check your internet connection, then refresh this page."
          );
        }

        const response = await fetch("./Multi_Dashboard.jsx");
        let source = await response.text();

        source = source
          .replace(/import\s+\{\s*useState,\s*useMemo\s*\}\s+from\s+["']react["'];?\s*/, "")
          .replace(/import\s+\{[^}]+\}\s+from\s+["']recharts["'];?\s*/, "")
          .replace(/export\s+default\s+function\s+Dashboard\s*\(/, "function Dashboard(");

        source =
          "const { useState, useMemo } = React;\n" +
          "const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, ReferenceLine } = Recharts;\n" +
          source +
          "\nReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);";

        const compiled = Babel.transform(source, {
          presets: ["react"],
          filename: "Multi_Dashboard.jsx",
        }).code;

        Function(compiled)();
      }

      boot().catch((error) => {
        document.getElementById("root").innerHTML =
          '<pre style="color:#ff8a8a;background:#071726;margin:0;padding:20px;white-space:pre-wrap">' +
          String(error && error.stack ? error.stack : error) +
          "</pre>";
      });
    </script>
  </body>
</html>
